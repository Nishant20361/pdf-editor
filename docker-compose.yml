version: "3.8"

services:
  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16-alpine
    container_name: pdf_editor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pdfuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securepassword123}
      POSTGRES_DB: ${POSTGRES_DB:-pdf_editor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pdfuser} -d ${POSTGRES_DB:-pdf_editor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf_network

  # ---- Redis Queue Cache ----
  redis:
    image: redis:7-alpine
    container_name: pdf_editor_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pdf_network

  # ---- FastAPI Backend ----
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pdf_editor_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pdfuser}:${POSTGRES_PASSWORD:-securepassword123}@postgres:5432/${POSTGRES_DB:-pdf_editor}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-pdf-editor-production-secret-key-at-least-32-chars-long-1234567890}
      - JWT_ALGORITHM=HS256
      - UPLOAD_DIR=/app/uploads
      - DEBUG=False
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost,https://${DOMAIN:-pdfeditor.example.com}
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-}
    volumes:
      - uploads_data:/app/uploads
    networks:
      - pdf_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ---- Next.js Frontend ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pdf_editor_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    networks:
      - pdf_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 20s
      timeout: 5s
      retries: 3

  # ---- Reverse Proxy (Nginx) ----
  nginx:
    image: nginx:alpine
    container_name: pdf_editor_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs_data:/etc/nginx/certs:ro
    networks:
      - pdf_network

volumes:
  postgres_data:
  redis_data:
  uploads_data:
  certs_data:

networks:
  pdf_network:
    driver: bridge
